services:
  - type: web
    name: receipt-extraction-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    envVars:
      - key: APP_NAME
        value: Invoice Receipt Extraction API
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: receipt-extraction-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: receipt-extraction-db
          property: connectionString
      - key: DEMO_API_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DEFAULT_MONTHLY_USAGE_LIMIT
        value: 1000
      - key: MAX_UPLOAD_SIZE_MB
        value: 10
      - key: UPLOAD_DIR
        value: /tmp/receipt-extraction-uploads
      - key: RATE_LIMIT_REQUESTS
        value: 60
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: receipt-extraction-db
    plan: free
